name: Deploy

# Publica el sitio en GitHub Pages. El repo ya contiene el build (`dist/`),
# así que esto no compila nada: sube lo que hay.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # El repo tiene README y este propio workflow, que no deben publicarse.
      # Se copia todo lo demás: index.html, assets/, favicon, robots, sitemap.
      - name: Preparar el sitio
        run: |
          set -euo pipefail
          mkdir -p _site
          for f in index.html favicon.svg og.svg robots.txt sitemap.xml; do
            [ -f "$f" ] && cp "$f" _site/
          done
          [ -d assets ] && cp -r assets _site/
          find _site -type f | sort
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
