<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="YouTube 4K — descargador de escritorio">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#6e50ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e1e2a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07070b"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <circle cx="980" cy="90" r="300" fill="#ff2d55" opacity="0.10"/>
  <circle cx="230" cy="600" r="260" fill="#6e50ff" opacity="0.09"/>

  <!-- barra de terminal -->
  <rect x="80" y="96" width="64" height="3" fill="#3ddc84"/>

  <text x="80" y="200" fill="#e8e8f0" font-family="'Chakra Petch',sans-serif" font-size="82" font-weight="700" letter-spacing="-2">YouTube 4K</text>
  <text x="80" y="272" fill="#8a8a9e" font-family="'IBM Plex Sans',sans-serif" font-size="34">Descargador de escritorio · 4K / 8K / HDR</text>

  <g font-family="'JetBrains Mono',monospace" font-size="22">
    <rect x="80" y="330" width="250" height="52" fill="none" stroke="#1e1e2a"/>
    <text x="100" y="364" fill="#e8e8f0">2160p60 HDR</text>
    <rect x="346" y="330" width="200" height="52" fill="none" stroke="#1e1e2a"/>
    <text x="366" y="364" fill="#e8e8f0">8K UHD</text>
    <rect x="562" y="330" width="230" height="52" fill="none" stroke="#1e1e2a"/>
    <text x="582" y="364" fill="#e8e8f0">aria2 multi</text>
  </g>

  <path d="M80 430h180l16-16 16 16h130l16-16 16 16h250" fill="none" stroke="url(#g)" stroke-width="3"/>
  <text x="80" y="512" fill="#55556a" font-family="'JetBrains Mono',monospace" font-size="20" letter-spacing="2">WINDOWS · LINUX · MACOS</text>
  <text x="80" y="556" fill="#55556a" font-family="'JetBrains Mono',monospace" font-size="20" letter-spacing="2">POR DREFTIAN</text>
</svg>
